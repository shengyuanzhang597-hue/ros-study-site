<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++ 语法速查字典（新手版）</title>

<script>try{var t=localStorage.getItem('theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e6e8ec; --line2:#eef0f3; --accent:#7c3aed; --accent-bg:#f3eefe;
    --code-bg:#1e1e1e;
    --hover:#fafbfc; --btnbg:#ffffff; --topbar:rgba(255,255,255,.93);
    --icode:#f0f1f3; --icodec:#b5316b; --introtxt:#374151;
    --nk-bg:#eef7f2; --nt-bg:#eff6ff; --nw-bg:#fff7ed;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#0f1115; --panel:#171a21; --ink:#e7e9ee; --muted:#97a1b0;
    --line:#2a2f3a; --line2:#22262f; --accent:#a78bfa; --accent-bg:#241b3d;
    --code-bg:#14161b;
    --hover:#1c2129; --btnbg:#232833; --topbar:rgba(18,20,26,.93);
    --icode:#2b3038; --icodec:#ff9ecb; --introtxt:#c7ccd6;
    --nk-bg:#12251f; --nt-bg:#152238; --nw-bg:#2b2010;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}
  .mono,code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}

  /* 站点导航条 */
  .sitenav{background:#111827;color:#e5e7eb;font-size:13px}
  .sitenav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px}
  .sitenav .logo{font-weight:700;color:#fff}
  .sitenav .sp{flex:1}
  .sitenav a{color:#cbd5e1;text-decoration:none;padding:2px 0;border-bottom:2px solid transparent}
  .sitenav a:hover{color:#fff;text-decoration:none}
  .sitenav a.active{color:#fff;font-weight:700;border-bottom-color:#fff}
  .themebtn{background:transparent;border:1px solid #39414f;color:#cbd5e1;border-radius:8px;
    padding:3px 10px;cursor:pointer;font-size:12.5px;line-height:1.4}
  .themebtn:hover{border-color:#5b667a;color:#fff}
  p code,li code,td code,.note code{background:var(--icode);color:var(--icodec);padding:1px 6px;border-radius:5px;font-size:.9em}

  .topbar{position:sticky;top:0;z-index:30;background:var(--topbar);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 20px}
  .topbar-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .brand{font-weight:700;font-size:17px;white-space:nowrap}
  .brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
  .searchwrap{flex:1;min-width:240px;position:relative}
  #q{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .searchwrap::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
  .meta{font-size:12.5px;color:var(--muted);white-space:nowrap} .meta b{color:var(--accent)}

  .layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px 1fr;gap:24px;padding:20px}
  .side{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
  .sidenav-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px 10px}
  .side-link{display:block;padding:6px 10px;border-radius:8px;color:var(--ink);font-size:13px;margin-bottom:1px}
  .side-link:hover{background:var(--line2);text-decoration:none}
  .side-link.active{background:var(--accent-bg);color:var(--accent);font-weight:600}

  .intro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:22px;font-size:13.5px;color:var(--introtxt)}
  .intro b{color:var(--ink)}

  .sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px 20px;margin-bottom:20px;scroll-margin-top:78px}
  .sec h2{font-size:19px;margin:0 0 2px}
  .sec .desc{color:var(--muted);font-size:13px;margin:0 0 10px}
  .sec p{margin:10px 0}

  table.sub{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  table.sub th{background:var(--hover);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:7px 11px;border-bottom:1px solid var(--line)}
  table.sub td{padding:7px 11px;border-bottom:1px solid var(--line2);vertical-align:top}
  table.sub tr:last-child td{border-bottom:none}
  table.sub td:first-child{white-space:nowrap}
  .tsub{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 0 2px;text-transform:uppercase;letter-spacing:.04em}

  ul.blist{margin:10px 0;padding-left:0;list-style:none}
  ul.blist li{position:relative;padding:4px 0 4px 22px}
  ul.blist li::before{content:"▸";position:absolute;left:2px;color:var(--accent)}

  .note{margin:14px 0;padding:11px 15px;border-radius:9px;font-size:13.5px;border-left:4px solid}
  .note.key{background:var(--nk-bg);border-color:#0f766e}
  .note.tip{background:var(--nt-bg);border-color:#2563eb}
  .note.warn{background:var(--nw-bg);border-color:#d97706}

  /* 代码块：黑底 + 语法高亮 */
  .code{margin:14px 0;border-radius:10px;overflow:hidden;background:var(--code-bg);border:1px solid #2b2b2b}
  .code-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;background:#252526;color:#9aa0a6;font-size:12px}
  .code-bar .lang{font-family:ui-monospace,Consolas,monospace;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .code-bar .copy{background:#3a3d41;border:1px solid #4a4d51;color:#d4d4d4;border-radius:6px;padding:2px 10px;font-size:11.5px;cursor:pointer}
  .code-bar .copy:hover{background:#4a4d51}
  .code-bar .copy.done{color:#4EC9B0;border-color:#4EC9B0}
  pre.code-body{margin:0;padding:14px 16px 16px;overflow:auto;font-size:13px;line-height:1.72;color:#d4d4d4;counter-reset:ln;tab-size:4}
  pre.code-body code{font-family:inherit}
  .cl{display:block;white-space:pre}
  .cl::before{counter-increment:ln;content:counter(ln);display:inline-block;width:2.1em;margin-right:1.1em;
    text-align:right;color:#5c6370;user-select:none;-webkit-user-select:none}
  .tk-kw1{color:#C586C0}   /* 控制关键字 */
  .tk-kw2{color:#569CD6}   /* 类型/修饰关键字 */
  .tk-type{color:#4EC9B0}  /* 类型名 */
  .tk-fn{color:#DCDCAA}    /* 函数名 */
  .tk-str{color:#CE9178}   /* 字符串 */
  .tk-num{color:#B5CEA8}   /* 数字 */
  .tk-cmt{color:#6A9955;font-style:italic} /* 注释 */
  .tk-pre{color:#C586C0}   /* 预处理指令 */
  .tk-op{color:#c8c8c8}    /* 运算符 */
  .tk-id{color:#9CDCFE}    /* 标识符 */

  #empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
  #gotop{position:fixed;right:22px;bottom:22px;display:none;border:1px solid var(--line);background:var(--btnbg);
    border-radius:10px;padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  #gotop:hover{color:var(--accent);border-color:var(--accent)}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;padding:14px}
    .side{position:static;display:flex;flex-wrap:wrap;gap:4px;max-height:none;border-bottom:1px solid var(--line);padding-bottom:10px}
    .sidenav-title{display:none} .side-link{margin:0;font-size:12.5px}
    .sec{padding:15px}
  }
  @media print{
    .topbar,.side,#gotop,.copy{display:none!important}
    body{background:#fff;font-size:11px}
    .layout{display:block;max-width:none;padding:0}
    .sec{break-inside:avoid;border-color:#ccc}
    .code,.code-bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

      <b>怎么用这份字典：</b>左边是目录，可按顺序从头学（从第 1 节“程序结构”开始），也可以随时用顶部搜索框查某个知识点。
      每节都是<b>“讲解 + 表格 + 黑白代码对照 + 易错点”</b>的结构——代码块是黑底彩色的，和编辑器里一样；右上角“复制”能直接拿走代码去跑。
      看不懂的语法点，先记住“**它长什么样、用来干什么**”，动手敲一遍再回头看，就通了。

<script>
const DATA = {"sections": [{"id": "structure", "title": "1. 程序结构 —— 看懂第一个 C++ 程序", "desc": "明白每一行在干什么", "blocks": [{"t": "p", "x": "一个 C++ 程序不管多复杂，都是由若干**函数**组成的，其中必须有一个 `main` 函数。程序总是从 `main` 开始执行，一行一行往下走。"}, {"t": "code", "title": "hello.cpp —— 你的第一个程序", "code": "#include <iostream>              // 引入输入输出库（提供 cout）\nusing namespace std;             // 使用标准命名空间，省去写 std::\n\nint main() {                     // 主函数：程序从这里开始运行\n    cout << \"Hello World\" << endl;   // 输出到屏幕，endl 表示换行\n    return 0;                    // 返回 0，表示程序正常结束\n}"}, {"t": "list", "items": ["`#include <iostream>`：告诉编译器要用到输入输出功能（如屏幕输出 `cout`）。以 `#` 开头的都叫**预处理指令**。", "`using namespace std;`：标准库的东西都在 `std` 命名空间里，这句之后可以直接写 `cout`，不用写 `std::cout`。", "`int main()`：主函数，每个程序**有且只有一个**；`int` 表示它返回一个整数。", "`{ }`：花括号包住函数体，里面的语句从上往下依次执行。", "`cout << ...`：把内容输出到屏幕。`<<` 像箭头，把数据“送”给 `cout`。", "`return 0;`：返回 0 给操作系统，表示程序正常结束（返回非 0 通常代表出错）。"]}, {"t": "note", "k": "key", "x": "背诵这一句：C++ 程序 = 预处理指令 + 函数；一切从 `main` 开始、到 `main` 结束。"}]}, {"id": "compile", "title": "2. 编译与运行", "desc": "看懂代码怎么变成能跑的程序", "blocks": [{"t": "p", "x": "C++ 是**编译型语言**：写好的 `.cpp` 文件不能直接运行，要先“翻译”成可执行文件。翻译过程分四步：预处理 → 编译 → 汇编 → 链接（详见《编译与调试》命令字典）。"}, {"t": "code", "title": "编译并运行", "code": "# 编译：把 hello.cpp 编译成可执行文件 hello\ng++ hello.cpp -o hello\n\n# 运行（./ 表示当前目录）\n./hello"}, {"t": "table", "title": "常见文件后缀", "h": ["后缀", "是什么"], "r": [[".cpp", "C++ 源文件（我们自己写的代码）"], [".h / .hpp", "头文件，放声明，供多个源文件共用"], [".o", "目标文件，编译的中间产物"], ["（无后缀）", "可执行文件，例如 hello"]]}, {"t": "list", "items": ["编译报错时，**先看最上面的第一条错误**，下面一串常常是被它连累的。", "加 `-Wall` 能看到更多警告，加 `-g` 能生成调试信息（配 gdb）。", "常用完整命令：`g++ hello.cpp -o hello -Wall -std=c++17`。"]}, {"t": "note", "k": "tip", "x": "如果提示 `command not found: g++`，先安装编译工具：`sudo apt install build-essential`。"}]}, {"id": "comment", "title": "3. 注释", "desc": "写给“人”看的说明", "blocks": [{"t": "p", "x": "注释不会被编译，只是给人看的。看别人代码时，注释往往比代码本身更早帮你理解意图。"}, {"t": "code", "title": "两种注释", "code": "// 单行注释：从 // 直到本行结束\n\n/*\n   多行注释：\n   可以跨越多行，\n   这里的内容都不会被编译\n*/\n\nint x = 5;   // 也可以写在代码后面"}, {"t": "note", "k": "tip", "x": "好注释解释“为什么这么写”，而不是复述“这行在干嘛”。比如 `// 用 -1 表示未找到`。"}]}, {"id": "types", "title": "4. 变量与基本数据类型", "desc": "数据都存在哪里、能存什么", "blocks": [{"t": "p", "x": "**变量**就是给一份数据起的名字。使用前要先声明它的**类型**——类型决定了它能存什么、占多大空间。"}, {"t": "code", "title": "常见变量的声明与赋值", "code": "int    age    = 20;        // 整数\ndouble price  = 9.99;      // 小数（默认就用它）\nfloat  ratio  = 0.5f;      // 单精度小数，注意末尾的 f\nchar   grade  = 'A';       // 单个字符，用单引号\nbool   passed = true;      // 布尔：true / false\nstring name   = \"Tom\";     // 字符串，用双引号（需 #include <string>）"}, {"t": "table", "title": "基本数据类型速查", "h": ["类型", "含义", "示例", "备注"], "r": [["int", "整数", "42、-7", "最常用"], ["double", "双精度小数", "3.14", "小数默认用它"], ["float", "单精度小数", "3.14f", "末尾必须加 f"], ["char", "单个字符", "'A'", "单引号，占 1 字节"], ["bool", "真假值", "true / false", "也可是 1 / 0"], ["string", "字符串", "\"hello\"", "需 #include <string>"], ["long long", "更大的整数", "123456789012", "超出 int 范围时用"]]}, {"t": "list", "items": ["变量名只能由字母、数字、下划线组成，**不能以数字开头**，且**区分大小写**（`Age` 和 `age` 是两个变量）。", "命名要见名知意：用 `totalPrice` 而不是 `a`；单词多时用驼峰式 `myAge` 或下划线 `my_age`。"]}, {"t": "note", "k": "warn", "x": "未初始化的变量里装的是随机“垃圾值”。**使用前一定要先赋值**，否则结果不可预测。"}]}, {"id": "const-auto", "title": "5. 常量、auto 与类型转换", "desc": "不想被改的值、让编译器猜类型", "blocks": [{"t": "p", "x": "有些值不希望被修改，用 `const` 声明为**常量**；`auto` 让编译器根据右边自动推断类型；不同类型混用时会发生**类型转换**。"}, {"t": "code", "title": "const / constexpr / auto / 类型转换", "code": "const double PI = 3.14159;   // 常量：之后不能再改，改了会报错\nconstexpr int MAX = 100;     // 编译期就确定的常量，效率更高\n\nauto x = 10;                 // x 是 int\nauto y = 2.5;                // y 是 double\nauto s = string(\"hi\");       // s 是 string\n\n// 类型转换\nint a = 3, b = 2;\ndouble r1 = a / b;           // 陷阱：整数相除，结果是 1（不是 1.5）\ndouble r2 = (double)a / b;   // 正确：先把 a 转成 double，得 1.5\nint n = (int)3.9;            // 强制转换：n = 3（截断，不四舍五入）"}, {"t": "note", "k": "warn", "x": "整数相除只保留整数部分：`7 / 2 = 3`。想要小数结果，务必先把其中一个数转成 `double`。"}]}, {"id": "operator", "title": "6. 运算符", "desc": "加减乘除、比较、逻辑", "blocks": [{"t": "table", "title": "算术运算符", "h": ["符号", "含义", "例"], "r": [["+ - * /", "加 减 乘 除", "5 + 2 = 7"], ["%", "取余（只能用于整数）", "7 % 2 = 1"], ["++ / --", "自增 1 / 自减 1", "i++ 让 i 加 1"]]}, {"t": "table", "title": "比较与逻辑运算符", "h": ["符号", "含义"], "r": [["== !=", "等于 / 不等于"], ["> < >= <=", "大于 / 小于 / 大于等于 / 小于等于"], ["&&", "并且（两个都为真才真）"], ["||", "或者（有一个为真就真）"], ["!", "取反（真变假、假变真）"]]}, {"t": "code", "title": "运算符示例", "code": "int a = 7, b = 2;\ncout << a / b;        // 3（整数除法）\ncout << a % b;        // 1（余数）\ncout << (a > b);      // 1（真；用 boolalpha 可让它显示 true）\n\nint i = 5;\ni++;                  // 自增：i 变成 6\ni--;                  // 自减：i 变成 5\n\nint x = 10;\nx += 3;               // 等价于 x = x + 3，x 变成 13"}, {"t": "note", "k": "warn", "x": "别把 `=` 和 `==` 混淆：`=` 是**赋值**，`==` 是**判断相等**。`if (x = 5)` 是经典 bug（它其实把 5 赋给了 x）。"}]}, {"id": "io", "title": "7. 输入输出（cin / cout）", "desc": "和用户交换数据", "blocks": [{"t": "p", "x": "`cout` 负责输出（读作 C-out，输出到屏幕），`cin` 负责输入（读作 C-in，从键盘读数据）。"}, {"t": "code", "title": "读写示例", "code": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    int age;\n    string name;\n    cout << \"请输入姓名和年龄：\";\n    cin >> name >> age;          // 从键盘读入，按空格/回车分隔\n    cout << \"你好，\" << name << \"，你 \" << age << \" 岁\" << endl;\n\n    double h;\n    cin >> h;                    // 再读一个身高\n    cout << \"身高：\" << h << \"\\n\";   // \\n 和 endl 都能换行，\\n 更快\n    return 0;\n}"}, {"t": "list", "items": ["`cin >>`：读取输入，可以连写多个变量，用空格或回车分隔。", "`cout <<`：输出，可以连写多个内容；`<<` 可以理解为“把数据塞进去”。", "`endl`：换行**并刷新缓冲**；如果只是换行，用 `\"\\n\"` 更快。"]}, {"t": "note", "k": "tip", "x": "`cout` / `cin` / `endl` 都在 `<iostream>` 里；`string` 需要再 `#include <string>`。"}]}, {"id": "if", "title": "8. 条件语句（if / switch）", "desc": "让程序会“分情况处理”", "blocks": [{"t": "code", "title": "if / else if / else", "code": "int score = 85;\nif (score >= 90) {\n    cout << \"优秀\";\n} else if (score >= 60) {\n    cout << \"及格\";\n} else {\n    cout << \"不及格\";\n}"}, {"t": "code", "title": "三目运算符（简单二选一）", "code": "string r = (score >= 60) ? \"及格\" : \"不及格\";   // 条件 ? 真时取值 : 假时取值"}, {"t": "code", "title": "switch（多分支）", "code": "int day = 3;\nswitch (day) {\n    case 1: cout << \"周一\"; break;    // 别忘了 break\n    case 3: cout << \"周三\"; break;\n    default: cout << \"其他\";\n}"}, {"t": "note", "k": "warn", "x": "`switch` 的每个 `case` 结束后通常要写 `break`，否则会“穿透”继续执行下一个 `case`。"}]}, {"id": "loop", "title": "9. 循环（for / while / 范围 for）", "desc": "重复做同一件事", "blocks": [{"t": "p", "x": "三种循环各有适用场景：`for` 适合“知道循环次数”，`while` 适合“满足条件就一直循环”，`范围 for` 适合“把容器里每个元素都过一遍”。"}, {"t": "code", "title": "for 循环（最常用）", "code": "// for (初始化; 循环条件; 每轮结束后的动作)\nfor (int i = 0; i < 5; i++) {\n    cout << i << \" \";     // 输出 0 1 2 3 4\n}"}, {"t": "code", "title": "while 与 do-while", "code": "int n = 1;\nwhile (n <= 5) {          // 先判断，条件成立才执行\n    cout << n << \" \";\n    n++;\n}\n\nint m = 10;\ndo {                      // 先执行一次，再判断\n    cout << m << \" \";\n    m++;\n} while (m < 5);          // 至少会执行一次"}, {"t": "code", "title": "范围 for（遍历容器，C++11）", "code": "int arr[] = {1, 2, 3, 4, 5};\nfor (int x : arr) {       // 依次把每个元素取出来赋给 x\n    cout << x << \" \";\n}\n\n// 想修改元素就加引用 &\nfor (int &x : arr) {\n    x = x * 2;            // 直接修改数组里的原元素\n}"}, {"t": "code", "title": "break 与 continue", "code": "for (int i = 0; i < 10; i++) {\n    if (i == 5) break;      // 立刻跳出整个循环\n    if (i % 2 == 0) continue;  // 跳过本轮剩下的语句，进入下一轮\n    cout << i << \" \";\n}"}, {"t": "note", "k": "key", "x": "`break` 是**跳出整个循环**，`continue` 是**跳过本轮、继续下一轮**——两者别搞混。"}]}, {"id": "array", "title": "10. 数组与 vector", "desc": "存一串相同类型的数据", "blocks": [{"t": "p", "x": "**数组**长度固定；**`vector`** 是“会自动变长的数组”，日常更推荐用它。"}, {"t": "code", "title": "数组", "code": "int a[5] = {1, 2, 3, 4, 5};   // 5 个整数\nint b[]  = {1, 2, 3};         // 长度自动推断为 3\ncout << a[0];                 // 下标从 0 开始！a[0] 是第一个元素\na[2] = 99;                    // 修改第 3 个元素"}, {"t": "code", "title": "vector（推荐）", "code": "#include <vector>\nusing namespace std;\n\nvector<int> v = {10, 20, 30};\nv.push_back(40);              // 在末尾添加一个元素 → {10,20,30,40}\ncout << v[0];                 // 访问元素，下标从 0 开始\ncout << v.size();             // 元素个数\nv.pop_back();                 // 删掉最后一个元素\n\nfor (int x : v) cout << x << \" \";   // 遍历"}, {"t": "table", "title": "vector 常用操作", "h": ["操作", "作用"], "r": [["v.push_back(x)", "末尾追加元素 x"], ["v.pop_back()", "删除末尾元素"], ["v.size()", "元素个数"], ["v[i]", "访问第 i 个元素（下标从 0 开始）"], ["v.empty()", "是否为空（true/false）"], ["v.clear()", "清空"]]}, {"t": "note", "k": "warn", "x": "下标**从 0 开始**：`a[0]` 是第 1 个，`a[n-1]` 才是第 n 个。越界访问不会报错，但结果是未定义的，很容易出 bug。"}]}, {"id": "string", "title": "11. 字符串 std::string", "desc": "处理文字", "blocks": [{"t": "p", "x": "`string` 是 C++ 的字符串类型，比 C 语言的字符数组好用得多，能直接拼接、比较、取长度。"}, {"t": "code", "title": "string 基本用法", "code": "#include <string>\nusing namespace std;\n\nstring a = \"Hello\";\nstring b = \"World\";\nstring c = a + \" \" + b;      // 拼接 → \"Hello World\"\n\ncout << c.size();            // 长度（字符个数）\ncout << c[0];                // 取第 1 个字符 'H'\nc[0] = 'h';                  // 修改 → \"hello World\"\n\nif (a == \"Hello\") {          // 直接比较是否相等\n    cout << \"相等\";\n}"}, {"t": "table", "title": "string 常用操作", "h": ["写法", "作用"], "r": [["a + b", "拼接两个字符串"], ["s.size() / s.length()", "得到长度"], ["s[i]", "访问第 i 个字符（从 0 开始）"], ["s.substr(起始, 个数)", "截取子串"], ["s.find(\"子串\")", "查找位置，找不到返回 npos"], ["s.empty()", "是否为空"]]}, {"t": "note", "k": "tip", "x": "`cin >> s` 遇到空格就停；想读取**一整行**（含空格）用 `getline(cin, s)`。"}]}, {"id": "function", "title": "12. 函数", "desc": "把一段功能打包，重复使用", "blocks": [{"t": "p", "x": "函数把一段代码封装起来，起个名字，之后用名字+参数就能反复调用。**返回值类型 函数名(参数列表) { 函数体 }**。"}, {"t": "code", "title": "定义、调用、返回值", "code": "// 返回类型  函数名(参数)\nint add(int a, int b) {\n    return a + b;            // return 把结果交回给调用者\n}\n\nvoid sayHi(string name) {    // void 表示不返回任何值\n    cout << \"你好，\" << name << endl;\n}\n\nint main() {\n    int sum = add(3, 5);     // 调用，sum = 8\n    sayHi(\"Tom\");\n    return 0;\n}"}, {"t": "code", "title": "默认参数与函数重载", "code": "// 默认参数：调用时不传就用默认值\nint power(int base, int exp = 2) {\n    int r = 1;\n    for (int i = 0; i < exp; i++) r *= base;\n    return r;\n}\npower(3);      // 3^2 = 9\npower(3, 3);   // 3^3 = 27\n\n// 函数重载：同名函数，参数不同\nint  maxv(int a, int b)       { return a > b ? a : b; }\ndouble maxv(double a, double b){ return a > b ? a : b; }"}, {"t": "code", "title": "引用传参（想修改调用者的变量时用 &）", "code": "void addOne(int n)  { n++; }        // 值传递：改的是副本，外面不变\nvoid addOneR(int &n) { n++; }       // 引用传递：直接改外面的变量\n\nint x = 10;\naddOne(x);   // x 还是 10\naddOneR(x);  // x 变成 11"}, {"t": "note", "k": "key", "x": "参数加 `&` 叫**引用传参**：函数里改它，外面的变量也跟着变；不加 `&` 是**值传递**，改的只是副本。"}]}, {"id": "pointer", "title": "13. 指针与引用（新手重点）", "desc": "理解“地址”这个概念就通了", "blocks": [{"t": "p", "x": "内存里的每个变量都住在某个**地址**上。**指针**就是专门存“地址”的变量；**引用**是给已有变量起的**别名**。这一节是新手最容易卡住的地方，慢慢来。"}, {"t": "code", "title": "指针：存的是地址", "code": "int a = 10;\nint *p = &a;        // &a 取 a 的地址，p 保存这个地址（p 是指向 int 的指针）\n\ncout << a;          // 10      变量的值\ncout << p;          // 地址（一串十六进制数）\ncout << *p;         // 10      * 解引用：访问 p 所指向的那块内存\n\n*p = 20;            // 通过指针修改 a\ncout << a;          // 20"}, {"t": "table", "title": "指针两个关键符号", "h": ["符号", "读法", "作用"], "r": [["&", "取地址符", "&a 得到变量 a 的地址"], ["*", "解引用符", "*p 访问 p 指向的那块内存"]]}, {"t": "code", "title": "引用：变量的别名", "code": "int a = 10;\nint &r = a;         // r 是 a 的别名（引用必须在定义时绑定）\n\nr = 20;             // 改 r 就是改 a\ncout << a;          // 20\n\n// 引用常用来做函数参数，省去拷贝、又能修改原值\nvoid swap(int &x, int &y) { int t = x; x = y; y = t; }\nint m = 1, n = 2;\nswap(m, n);         // m=2, n=1"}, {"t": "code", "title": "动态内存：new 与 delete", "code": "int *p = new int(5);    // 在堆上分配一个 int，初始值 5\ncout << *p;             // 5\ndelete p;               // 用完必须释放，否则内存泄漏\n\nint *arr = new int[10]; // 分配数组\ndelete[] arr;           // 数组用 delete[]"}, {"t": "note", "k": "warn", "x": "指针必须指向有效内存才能用。指向“空”用 `nullptr`：`int *p = nullptr;`。用 `new` 分配的内存一定要 `delete`，否则会内存泄漏。"}, {"t": "note", "k": "key", "x": "一句话区分：**指针**是“存地址的变量”，可以改指向；**引用**是“别名”，绑定了就换不了。日常传参优先用引用，更安全。"}]}, {"id": "struct", "title": "14. 结构体 struct", "desc": "把几个不同类型的数据打包成一个", "blocks": [{"t": "p", "x": "`struct` 能把一组相关的数据（类型可以不同）组合成一个新的“类型”，用来表示一个整体，比如一个学生的姓名、年龄、分数。"}, {"t": "code", "title": "定义与使用结构体", "code": "struct Student {\n    string name;\n    int    age;\n    double score;\n};\n\nint main() {\n    Student s;                 // 声明一个 Student 变量\n    s.name  = \"Tom\";           // 用 . 访问成员\n    s.age   = 20;\n    s.score = 92.5;\n    cout << s.name << \" \" << s.score;\n\n    Student t = {\"Jerry\", 19, 88.0};   // 一步初始化\n    return 0;\n}"}, {"t": "note", "k": "tip", "x": "`struct` 和 `class` 几乎一样，唯一区别：`struct` 成员**默认 public**，`class` 成员**默认 private**。C++ 里常把只有数据的简单结构用 struct。"}]}, {"id": "class", "title": "15. 类与对象", "desc": "面向对象的核心", "blocks": [{"t": "p", "x": "**类（class）**是一张“蓝图”，把**属性**（数据）和**方法**（函数）封装在一起；用类造出来的具体东西叫**对象**。C++ 面向对象三大特性：**封装、继承、多态**。"}, {"t": "code", "title": "定义一个类并创建对象", "code": "class Circle {\nprivate:                     // 私有：只能在类内部访问\n    double r;                // 属性：半径\n\npublic:                      // 公有：外部可以访问\n    Circle(double radius) {  // 构造函数：创建对象时自动调用\n        r = radius;\n    }\n\n    double area() {          // 方法：计算面积\n        return 3.14159 * r * r;\n    }\n    double perimeter() {\n        return 2 * 3.14159 * r;\n    }\n};\n\nint main() {\n    Circle c(5.0);           // 创建对象（实例化），调用构造函数\n    cout << c.area();        // 通过 . 调用方法\n    return 0;\n}"}, {"t": "table", "title": "三种访问修饰符", "h": ["关键字", "谁能访问"], "r": [["public", "任何地方都能访问（对外的接口）"], ["private", "只有类内部（和友元）能访问（默认）"], ["protected", "类内部和子类能访问（为继承准备）"]]}, {"t": "code", "title": "构造函数与析构函数", "code": "class Person {\npublic:\n    string name;\n    Person() { cout << \"对象被创建\\n\"; }          // 构造函数：类名做函数名，无返回类型\n    Person(string n) : name(n) {}                 // 带初始化列表的构造\n    ~Person() { cout << \"对象被销毁\\n\"; }          // 析构函数：名字前加 ~\n};\n\nint main() {\n    Person p1;                 // 自动调用构造\n    Person p2(\"Tom\");\n    return 0;                  // 离开作用域时自动调用析构\n}"}, {"t": "code", "title": "this 指针与静态成员", "code": "class Counter {\npublic:\n    static int count;          // 静态成员变量：所有对象共享一份\n    void add() { this->count++; }   // this 指向“当前这个对象”\n};\nint Counter::count = 0;        // 静态成员要在类外初始化一次\n\nint main() {\n    Counter a, b;\n    a.add();\n    b.add();\n    cout << Counter::count;    // 2（共享的）\n    return 0;\n}"}, {"t": "code", "title": "类内声明、类外实现", "code": "class Circle {\n    double r;\npublic:\n    double area();             // 类内只声明\n};\n\n// 类外实现时要写上 类名:: 指定作用域\ndouble Circle::area() {\n    return 3.14159 * r * r;\n}"}, {"t": "note", "k": "key", "x": "记住三件事：① 构造函数在创建对象时自动调用（初始化），析构函数在对象销毁时自动调用（清理）；② `public` 的成员才能被对象用 `.` 访问；③ 静态成员属于“类”，用 `类名::` 访问。"}]}, {"id": "inherit", "title": "16. 继承", "desc": "子类复用父类，再加自己的东西", "blocks": [{"t": "p", "x": "**继承**让一个类（子类/派生类）获得另一个类（父类/基类）的成员，从而实现代码复用。语法：`class 子类 : 继承方式 父类`。"}, {"t": "code", "title": "继承的基本写法", "code": "class Animal {                 // 基类（父类）\npublic:\n    void eat()  { cout << \"吃东西\\n\"; }\n    void sleep(){ cout << \"睡觉\\n\"; }\n};\n\nclass Dog : public Animal {    // 派生类（子类）：公有继承 Animal\npublic:\n    void bark() { cout << \"汪汪\\n\"; }   // 子类自己的新方法\n};\n\nint main() {\n    Dog d;\n    d.eat();     // 从父类继承来的\n    d.sleep();   // 从父类继承来的\n    d.bark();    // 子类自己的\n    return 0;\n}"}, {"t": "table", "title": "三种继承方式对父类成员的影响", "h": ["继承方式", "父类 public 成员在子类中变为"], "r": [["public", "public（最常用）"], ["protected", "protected"], ["private", "private"]]}, {"t": "code", "title": "继承中的构造与析构顺序", "code": "class Base {\npublic:\n    Base()  { cout << \"父类构造\\n\"; }\n    ~Base() { cout << \"父类析构\\n\"; }\n};\nclass Derived : public Base {\npublic:\n    Derived()  { cout << \"子类构造\\n\"; }\n    ~Derived() { cout << \"子类析构\\n\"; }\n};\n\nint main() { Derived d; return 0; }\n// 输出顺序：父类构造 → 子类构造 → 子类析构 → 父类析构\n// 一句话：构造先父后子，析构先子后父（像盖楼和拆楼）"}, {"t": "note", "k": "key", "x": "**构造先父后子，析构先子后父**。父类私有成员（private）子类不能直接访问，用 `protected` 才能被子类访问。"}]}, {"id": "polymorphism", "title": "17. 多态（虚函数）", "desc": "同一个调用，不同对象不同表现", "blocks": [{"t": "p", "x": "多态指“同一句话，对不同对象有不同表现”。实现关键是**虚函数**（在函数前加 `virtual`）。当用父类指针/引用指向子类对象时，调用的会是**子类重写**的版本。"}, {"t": "code", "title": "虚函数实现多态", "code": "class Animal {\npublic:\n    virtual void speak() {       // virtual 表示这是虚函数\n        cout << \"动物在叫\\n\";\n    }\n};\n\nclass Cat : public Animal {\npublic:\n    void speak() override {      // override 表示重写父类虚函数\n        cout << \"喵喵\\n\";\n    }\n};\n\nclass Dog : public Animal {\npublic:\n    void speak() override {\n        cout << \"汪汪\\n\";\n    }\n};\n\nvoid doSpeak(Animal &a) { a.speak(); }   // 参数是父类引用\n\nint main() {\n    Cat c;\n    Dog d;\n    doSpeak(c);     // 喵喵\n    doSpeak(d);     // 汪汪\n    return 0;\n}"}, {"t": "code", "title": "纯虚函数与抽象类", "code": "class Shape {\npublic:\n    virtual double area() = 0;   // 纯虚函数（=0），Shape 成为抽象类\n};\n// 抽象类不能创建对象，必须由子类实现 area() 才能实例化\n\nclass Square : public Shape {\n    double side;\npublic:\n    Square(double s) : side(s) {}\n    double area() override { return side * side; }\n};"}, {"t": "list", "items": ["形成多态的两个条件：**① 有继承关系；② 子类重写父类的虚函数**。", "通过**父类的指针或引用**调用虚函数时，才会发生动态绑定（运行时决定调哪个）。", "加 `override` 是好习惯：万一手滑写错签名，编译器会提醒你。"]}, {"t": "note", "k": "warn", "x": "忘记写 `virtual`，就变成静态绑定，调用时只会执行父类版本——这是多态最常见的 bug。"}]}, {"id": "template", "title": "18. 模板（泛型编程）", "desc": "写一遍，适配所有类型", "blocks": [{"t": "p", "x": "**模板**把“类型”也变成参数，让一份代码适用于多种数据类型，避免为每种类型重写一遍。"}, {"t": "code", "title": "函数模板", "code": "template <typename T>        // T 是类型参数，typename 也可写 class\nT maxv(T a, T b) {\n    return a > b ? a : b;\n}\n\nint main() {\n    cout << maxv(3, 7);          // T 自动推导为 int\n    cout << maxv(2.5, 1.5);      // T 自动推导为 double\n    cout << maxv<int>(3, 7);     // 也可以显式指定类型\n    return 0;\n}"}, {"t": "code", "title": "类模板", "code": "template <class T>\nclass Box {\n    T content;\npublic:\n    void set(T v) { content = v; }\n    T    get()    { return content; }\n};\n\nint main() {\n    Box<int>    b1;   // 类模板必须显式指定类型\n    Box<string> b2;\n    b1.set(100);\n    b2.set(\"hello\");\n    return 0;\n}"}, {"t": "note", "k": "key", "x": "函数模板能**自动推导**类型；**类模板必须显式指定**（如 `Box<int>`）。模板的目的就是：把类型参数化，一份代码多处复用。"}]}, {"id": "namespace", "title": "19. 命名空间 namespace", "desc": "解决“重名”的问题", "blocks": [{"t": "p", "x": "命名空间是一组名字的“文件夹”，用来避免不同库里的同名函数/变量冲突。`cout` 其实全名是 `std::cout`——`std` 就是标准库的命名空间。"}, {"t": "code", "title": "三种用法", "code": "std::cout << \"hi\";          // 1) 老老实实写全名（最清晰）\n\nusing namespace std;         // 2) 声明后可直接用短名（方便，但大项目慎用）\ncout << \"hi\";\n\nusing std::cout;             // 3) 只引入某一个名字（折中）\n\nnamespace my {\n    int value = 10;          // 自己定义命名空间\n}\ncout << my::value;           // 用 my:: 访问"}, {"t": "note", "k": "tip", "x": "练习和小程序里 `using namespace std;` 很方便；正式项目里过多使用可能引起命名冲突，更推荐写 `std::`。"}]}, {"id": "stdlib", "title": "20. 标准库常用速查", "desc": "不用自己造轮子", "blocks": [{"t": "table", "title": "最常用的几个容器", "h": ["容器", "用途", "头文件"], "r": [["vector", "可变长数组（最常用）", "<vector>"], ["string", "字符串", "<string>"], ["map", "键值对（像字典）", "<map>"], ["set", "不重复的集合", "<set>"], ["pair", "一对值", "<utility>"]]}, {"t": "code", "title": "map 与 set", "code": "#include <map>\n#include <set>\nusing namespace std;\n\nmap<string, int> age;        // 名字 → 年龄\nage[\"Tom\"] = 20;\nage[\"Jerry\"] = 19;\ncout << age[\"Tom\"];          // 20\n\nset<int> s = {3, 1, 2, 2, 3};    // 自动去重并排序 → {1,2,3}\ncout << s.count(2);          // 1（存在）"}, {"t": "code", "title": "algorithm 常用算法", "code": "#include <algorithm>\n#include <vector>\nusing namespace std;\n\nvector<int> v = {3, 1, 4, 1, 5};\nsort(v.begin(), v.end());            // 升序排序 → {1,1,3,4,5}\nsort(v.begin(), v.end(), greater<int>());  // 降序\nreverse(v.begin(), v.end());         // 反转\n\nint mx = *max_element(v.begin(), v.end());   // 最大值\nint mn = *min_element(v.begin(), v.end());   // 最小值\n\nauto it = find(v.begin(), v.end(), 4);       // 查找 4 的位置"}, {"t": "note", "k": "tip", "x": "容器普遍支持 `.begin()` / `.end()` 表示范围，`sort`、`find` 这类算法都作用在这对区间上。"}]}, {"id": "errors", "title": "21. 新手常见错误清单", "desc": "踩过这些坑，你就入门了", "blocks": [{"t": "list", "items": ["**忘记写分号 `;`** —— 每一条语句末尾都要有。报错常常指向下一行，别被骗。", "**`=` 和 `==` 混淆** —— 判断相等要用 `==`，赋值用 `=`。", "**整数除法** —— `7/2` 得 3，不是 3.5；要小数先转 `double`。", "**数组/vector 下标越界** —— 下标从 0 开始，最后一个是 `size()-1`。", "**变量没初始化就用** —— 里面是垃圾值，结果随机。", "**忘记 `#include`** —— 用 `string` 要 `<string>`，用 `vector` 要 `<vector>`。", "**漏了 `break`** —— switch 里不写会穿透执行下一个 case。", "**忘写 `virtual`** —— 多态失效，只会调用父类版本。", "**`new` 了没 `delete`** —— 内存泄漏；数组要用 `delete[]`。", "**函数声明与定义签名不一致** —— 参数或返回类型对不上，链接报错。", "**字符串用双引号、字符用单引号** —— `\"A\"` 是字符串，`'A'` 才是字符。"]}, {"t": "note", "k": "key", "x": "遇到编译报错，**从第一条看起**，且往往错误在它上面一行；报错信息里的 `undefined reference` 通常是**链接不到函数实现**。"}]}, {"id": "glossary", "title": "22. 术语中英对照", "desc": "看懂文档和报错里的英文", "blocks": [{"t": "table", "title": "高频术语", "h": ["中文", "英文", "一句话说明"], "r": [["变量", "variable", "存数据的名字"], ["常量", "constant", "不能改的值（const）"], ["函数", "function", "打包的一段功能"], ["参数 / 返回值", "parameter / return value", "传给函数的输入 / 函数给出的结果"], ["数组 / 容器", "array / container", "存一串数据的结构"], ["类 / 对象", "class / object", "蓝图 / 按蓝图造出来的实例"], ["成员", "member", "类里面的变量或函数"], ["继承 / 派生类", "inheritance / derived class", "子类复用父类"], ["多态 / 虚函数", "polymorphism / virtual function", "同名调用不同表现"], ["模板", "template", "类型参数化的代码"], ["命名空间", "namespace", "名字的“文件夹”"], ["编译 / 链接", "compile / link", "翻译代码 / 拼装成可执行文件"], ["声明 / 定义", "declaration / definition", "告诉有这个东西 / 真正实现它"], ["指针 / 引用", "pointer / reference", "存地址的变量 / 变量的别名"], ["头文件", "header file", "以 .h/.hpp 结尾，放声明"]]}]}, {"id": "how-to-read", "title": "23. 如何看懂一段陌生代码", "desc": "一套可复用的阅读方法", "blocks": [{"t": "p", "x": "看陌生代码不要从头逐字读，按下面这个顺序拆解，会快很多："}, {"t": "list", "items": ["**先找 `main`**：程序的入口，从这里理清整体流程。", "**看 `#include`**：用了哪些库，基本能猜出代码要干什么（如 `<vector>`、`<cmath>`）。", "**看有哪些函数和类**：函数的**名字 + 参数 + 返回类型**往往就能说明它在干嘛，先不急着看内部实现。", "**遇到不认识的类型**：先判断它是基本类型、标准库类型（vector/string/map），还是自定义的类/结构体。", "**关注数据怎么流动**：输入从哪来、经过哪些处理、结果输出到哪。", "**看不懂的语法先跳过**，抓大放小；回头再查具体语法点（这份字典就是干这个的）。", "**动手改一改、跑一跑**：把某个值打印出来、改个数字看结果，比干看快得多。"]}, {"t": "note", "k": "key", "x": "口诀：**先主干（main）后枝叶（函数），先接口（名字/参数）后实现（函数体），看不懂就动手跑**。"}]}]};

/* ---------- 行内小语法：`code` 与 **加粗** ---------- */
function escHtml(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(s){
  s=escHtml(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return s;
}
function attr(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var KW1=["if","else","for","while","do","switch","case","default","break","continue","return","goto","new","delete","throw","try","catch","sizeof","operator","this"];
var KW2=["int","char","bool","float","double","void","long","short","signed","unsigned","const","static","virtual","friend","inline","explicit","auto","mutable","volatile","class","struct","union","enum","public","private","protected","template","typename","using","namespace","typedef","constexpr","nullptr","true","false","override","final","extern","register"];
var TYPES=["std","string","vector","map","set","pair","cout","cin","cerr","endl","size_t","ostream","istream","stringstream","queue","stack","array","list","deque","unordered_map","unique_ptr","shared_ptr","function","uint8_t","int64_t","greater"];
function setOf(a){var o={};a.forEach(function(x){o[x]=1;});return o;}
var K1=setOf(KW1),K2=setOf(KW2),TY=setOf(TYPES);
function sp(cls,txt){return '<span class="tk-'+cls+'">'+escHtml(txt)+'</span>';}
function hl(code){
  var out="",i=0,n=code.length,c,j,w,k,cls;
  while(i<n){
    c=code[i];
    if(c==="/"&&code[i+1]==="/"){j=code.indexOf("\n",i);if(j<0)j=n;out+=sp("cmt",code.slice(i,j));i=j;continue;}
    if(c==="/"&&code[i+1]==="*"){j=code.indexOf("*/",i+2);j=(j<0)?n:j+2;out+=sp("cmt",code.slice(i,j));i=j;continue;}
    if(c==="#"&&(i===0||code[i-1]==="\n")){j=code.indexOf("\n",i);if(j<0)j=n;out+=sp("pre",code.slice(i,j));i=j;continue;}
    if(c==='"'){j=i+1;while(j<n&&code[j]!=='"'){if(code[j]==="\\")j++;j++;}j=Math.min(j+1,n);out+=sp("str",code.slice(i,j));i=j;continue;}
    if(c==="'"){j=i+1;while(j<n&&code[j]!=="'"){if(code[j]==="\\")j++;j++;}j=Math.min(j+1,n);out+=sp("str",code.slice(i,j));i=j;continue;}
    if(c>="0"&&c<="9"){j=i;while(j<n&&/[0-9a-fA-FxXbB._]/.test(code[j]))j++;out+=sp("num",code.slice(i,j));i=j;continue;}
    if(/[A-Za-z_]/.test(c)){j=i;while(j<n&&/[A-Za-z0-9_]/.test(code[j]))j++;w=code.slice(i,j);k=j;while(k<n&&code[k]===" ")k++;
      if(K1[w])cls="kw1";else if(K2[w])cls="kw2";else if(TY[w])cls="type";else if(code[k]==="(")cls="fn";else if(/[A-Z]/.test(w[0]))cls="type";else cls="id";
      out+=sp(cls,w);i=j;continue;}
    out+=sp("op",c);i++;
  }
  return out;
}

/* ---------- 各类型内容块渲染 ---------- */
function blockHtml(b){
  if(b.t==="p")    return '<p>'+md(b.x)+'</p>';
  if(b.t==="h")    return '<div class="tsub">'+md(b.x)+'</div>';
  if(b.t==="list") return '<ul class="blist">'+b.items.map(function(x){return '<li>'+md(x)+'</li>';}).join("")+'</ul>';
  if(b.t==="note") return '<div class="note '+b.k+'">'+md(b.x)+'</div>';
  if(b.t==="table"){
    var h=''+(b.title?'<div class="tsub">'+escHtml(b.title)+'</div>':'');
    h+='<table class="sub"><thead><tr>'+b.h.map(function(x){return '<th>'+md(x)+'</th>';}).join("")+'</tr></thead><tbody>';
    h+=b.r.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+md(c)+'</td>';}).join("")+'</tr>';}).join("");
    return h+'</tbody></table>';
  }
  if(b.t==="code"){
    var lines=hl(b.code).split("\n").map(function(l){return '<span class="cl">'+(l.length?l:" ")+'</span>';}).join("\n");
    return '<div class="code"><div class="code-bar"><span class="lang">'+(b.title?"C++ · "+escHtml(b.title):"C++")+'</span>'
      + '<button class="copy" data-copy="'+attr(b.code)+'">复制</button></div>'
      + '<pre class="code-body"><code>'+lines+'</code></pre></div>';
  }
  return "";
}
function secSearch(s){
  var p=[s.title,s.desc];
  s.blocks.forEach(function(b){
    if(b.x)p.push(b.x);
    if(b.code)p.push(b.code);
    if(b.title)p.push(b.title);
    if(b.items)b.items.forEach(function(x){p.push(x);});
    if(b.r)b.r.forEach(function(r){p.push(r.join(" "));});
    if(b.h)b.h.forEach(function(x){p.push(x);});
  });
  return p.join(" ").toLowerCase();
}
function secHtml(s){
  return '<section class="sec" id="sec-'+s.id+'" data-search="'+attr(secSearch(s))+'">'
    +'<h2>'+escHtml(s.title)+'</h2><p class="desc">'+escHtml(s.desc)+'</p>'
    + s.blocks.map(blockHtml).join("") + '</section>';
}

/* ---------- 渲染目录与正文 ---------- */
var side=document.getElementById("side");
side.innerHTML='<div class="sidenav-title">目录</div>'+sections.map(function(s){
  return '<a class="side-link" data-sec="'+s.id+'" href="#sec-'+s.id+'">'+escHtml(s.title)+'</a>';
}).join("");
document.getElementById("sections").innerHTML=sections.map(secHtml).join("");

/* ---------- 复制 ---------- */
document.addEventListener("click",function(e){
  var cp=e.target.closest(".copy");
  if(!cp)return;
  var txt=cp.getAttribute("data-copy");
  function done(){cp.classList.add("done");var o=cp.textContent;cp.textContent="已复制";setTimeout(function(){cp.classList.remove("done");cp.textContent=o;},1100);}
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(done).catch(function(){});}else{done();}
});

/* ---------- 搜索 ---------- */
var q=document.getElementById("q"),meta=document.getElementById("meta"),empty=document.getElementById("empty");
function runSearch(){
  var toks=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var shown=0;
  document.querySelectorAll(".sec").forEach(function(el){
    var ok=!toks.length||toks.every(function(t){return el.getAttribute("data-search").indexOf(t)>=0;});
    el.style.display=ok?"":"none"; if(ok)shown++;
  });
  if(toks.length){meta.innerHTML="匹配 <b>"+shown+"</b> 节";empty.style.display=shown?"none":"block";}
  else{meta.innerHTML="共 <b>"+sections.length+"</b> 节";empty.style.display="none";}
}
q.addEventListener("input",runSearch);
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(e.key==="Escape"&&document.activeElement===q){q.value="";runSearch();q.blur();}
});

/* ---------- 高亮当前目录 + 回到顶部 ---------- */
var links=document.querySelectorAll(".side-link");
window.addEventListener("scroll",function(){
  document.getElementById("gotop").style.display=window.scrollY>400?"block":"none";
  var y=window.scrollY+90,cur="";
  document.querySelectorAll(".sec").forEach(function(s){if(s.style.display!=="none"&&s.offsetTop<=y)cur=s.id.replace("sec-","");});
  links.forEach(function(l){l.classList.toggle("active",l.getAttribute("data-sec")===cur);});
},{passive:true});
document.getElementById("gotop").onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};

meta.innerHTML="共 <b>"+sections.length+"</b> 节";

/* 主题切换 */
var tt=document.getElementById("themeToggle");
function syncThemeBtn(){tt.textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";}
syncThemeBtn();
tt.onclick=function(){
  var d=document.documentElement.getAttribute("data-theme")==="dark";
  var n=d?"light":"dark";
  document.documentElement.setAttribute("data-theme",n);
  try{localStorage.setItem("theme",n);}catch(e){}
  syncThemeBtn();
};
</script>
