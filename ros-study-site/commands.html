<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROS / Ubuntu 命令速查字典</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📘%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e6e8ec; --line2:#eef0f3; --accent:#2563eb; --accent-bg:#eff4ff;
    --code-bg:#f2f4f7; --hi:#0f766e;
    --hover:#fafbfc; --btnbg:#ffffff; --topbar:rgba(255,255,255,.92);
    --lv-h:#dc2626; --lv-h-bg:#fee2e2; --lv-m:#b45309; --lv-m-bg:#fef3c7; --lv-l:#6b7280; --lv-l-bg:#eef0f3;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#0f1115; --panel:#171a21; --ink:#e7e9ee; --muted:#97a1b0;
    --line:#2a2f3a; --line2:#22262f; --accent:#7aa2ff; --accent-bg:#1b2438;
    --code-bg:#232833; --hi:#4ec9b0;
    --hover:#1c2129; --btnbg:#232833; --topbar:rgba(18,20,26,.92);
    --lv-h:#f87171; --lv-h-bg:#3a1f1f; --lv-m:#fbbf24; --lv-m-bg:#3a2f14; --lv-l:#9aa4b2; --lv-l-bg:#242a34;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  code,kbd,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* 站点导航条 */
  .sitenav{background:#111827;color:#e5e7eb;font-size:13px}
  .sitenav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px}
  .sitenav .logo{font-weight:700;color:#fff}
  .sitenav .sp{flex:1}
  .sitenav a{color:#cbd5e1;text-decoration:none;padding:2px 0;border-bottom:2px solid transparent}
  .sitenav a:hover{color:#fff;text-decoration:none}
  .sitenav a.active{color:#fff;font-weight:700;border-bottom-color:#fff}
  .themebtn{background:transparent;border:1px solid #39414f;color:#cbd5e1;border-radius:8px;
    padding:3px 10px;cursor:pointer;font-size:12.5px;line-height:1.4}
  .themebtn:hover{border-color:#5b667a;color:#fff}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:30;background:var(--topbar);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 20px}
  .topbar-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .brand{font-weight:700;font-size:17px;white-space:nowrap}
  .brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
  .searchwrap{flex:1;min-width:240px;position:relative}
  #q{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;background:var(--btnbg);color:var(--ink);outline:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .searchwrap::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.6;pointer-events:none}
  .meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .meta b{color:var(--accent)}

  /* layout */
  .layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:196px 1fr;gap:24px;padding:20px}
  .side{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
  .sidenav-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px 10px}
  .side-link{display:block;padding:6px 10px;border-radius:8px;color:var(--ink);font-size:13.5px;margin-bottom:2px}
  .side-link:hover{background:var(--line2);text-decoration:none}
  .side-link.active{background:var(--accent-bg);color:var(--accent);font-weight:600}

  /* scenario table */
  .scenario-sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px 8px;margin-bottom:26px}
  h2{font-size:19px;margin:0 0 6px}
  .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  #scenario th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;
    letter-spacing:.04em;border-bottom:1px solid var(--line);padding:8px 10px}
  #scenario td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  #scenario tr:hover{background:var(--accent-bg)}
  .sc-cmd code{background:var(--code-bg);padding:2px 7px;border-radius:6px;font-size:12.5px;white-space:nowrap}
  .sc-note{color:var(--muted)}
  .sc-intent{width:40%}

  /* category */
  .cat{margin-bottom:26px;scroll-margin-top:78px}
  .cat-h{font-size:20px;margin:0 0 2px;padding-top:8px;border-top:2px solid var(--ink);display:flex;align-items:baseline;gap:10px}
  .cat-desc{font-size:12.5px;font-weight:400;color:var(--muted)}

  /* card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;scroll-margin-top:78px}
  .card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
  .card-head:hover{background:var(--hover)}
  .cname{font-size:15.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
  .cfull{font-size:12px;color:var(--muted);white-space:nowrap}
  .cuse{flex:1;color:var(--muted);font-size:13.5px;min-width:0}
  .lvl{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .lv-h{color:var(--lv-h);background:var(--lv-h-bg)}
  .lv-m{color:var(--lv-m);background:var(--lv-m-bg)}
  .lv-l{color:var(--lv-l);background:var(--lv-l-bg)}
  .chev{color:var(--muted);transition:transform .18s;font-size:12px}
  .card.open .chev{transform:rotate(90deg)}
  .card-body{display:none;padding:2px 16px 16px;border-top:1px solid var(--line2)}
  .card.open .card-body{display:block}

  .row{margin:12px 0}
  .k{display:inline-block;font-size:12px;color:var(--muted);min-width:38px;font-weight:600;margin-right:6px}
  code.syntax,code.ex{background:var(--code-bg);padding:3px 8px;border-radius:6px;font-size:13px}
  .copy{border:1px solid var(--line);background:var(--btnbg);color:var(--muted);border-radius:7px;padding:2px 9px;
    font-size:11.5px;cursor:pointer;margin-left:6px;vertical-align:middle}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy.done{color:var(--hi);border-color:var(--hi)}
  table.sub{margin:8px 0;font-size:13px;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  table.sub th{background:var(--hover);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
  table.sub td{padding:6px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  table.sub tr:last-child td{border-bottom:none}
  table.sub td:first-child{white-space:nowrap}
  ol.ex-list{list-style:none;padding:0;margin:6px 0}
  ol.ex-list li{padding:5px 0;border-bottom:1px dashed var(--line2)}
  ol.ex-list li:last-child{border-bottom:none}
  ol.ex-list .d{color:var(--muted);font-size:12.5px;margin-left:8px}
  ul.tips{margin:8px 0 0;padding:0;list-style:none}
  ul.tips li{position:relative;padding:4px 0 4px 20px;font-size:13px}
  ul.tips li::before{content:"▸";position:absolute;left:2px;color:var(--muted)}
  .tsub{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.04em}
  .src{font-size:11.5px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line2);padding-top:8px}

  .toolbar{display:flex;gap:10px;align-items:center;margin:0 0 4px}
  .toolbar button{border:1px solid var(--line);background:var(--btnbg);border-radius:8px;padding:5px 12px;font-size:12.5px;
    color:var(--muted);cursor:pointer}
  .toolbar button:hover{border-color:var(--accent);color:var(--accent)}
  #empty{display:none;text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
  #gotop{position:fixed;right:22px;bottom:22px;display:none;border:1px solid var(--line);
    background:var(--btnbg);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  #gotop:hover{color:var(--accent);border-color:var(--accent)}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;padding:14px}
    .side{position:static;display:flex;flex-wrap:wrap;gap:4px;max-height:none;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
    .sidenav-title{display:none}
    .side-link{margin:0}
    .sc-intent{width:auto}
  }
  @media print{
    .topbar,.side,.toolbar,#gotop,.copy{display:none!important}
    body{font-size:11px;background:#fff}
    .layout{display:block;max-width:none;padding:0}
    .card{break-inside:avoid;border-color:#ccc}
    .card-body{display:block!important}
  }
</style>
</head>
<body>
<nav class="sitenav"><div class="in">
  <a class="logo" href="index.html">ROS 学习速查站</a>
  <span class="sp"></span>
  <a href="index.html">首页</a>
  <a href="commands.html" class="active">命令速查</a>
  <a href="cpp.html">C++ 语法</a>
  <button id="themeToggle" class="themebtn" title="切换深色 / 浅色模式">🌙</button>
</div></nav>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">ROS / Ubuntu 命令速查字典<small>基于课程课件整理 · 场景反查 + 命令卡片</small></div>
    <div class="searchwrap"><input id="q" type="search" placeholder="输入你想做的事或命令，中文也行：看开头 / 改权限 / ros2 topic / 编译" autocomplete="off"></div>
    <div class="meta" id="meta"></div>
  </div>
</header>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main class="content">
    <section class="scenario-sec" id="scenario-sec">
      <h2>场景速查：我想做… → 用这个命令</h2>
      <p class="hint">忘了命令叫什么？先在左边这张表里找你的“意图”，再到下面点开对应的命令卡片看细节。</p>
      <table id="scenario">
        <thead><tr><th class="sc-intent">我想做…</th><th>命令</th><th>说明</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <div class="toolbar">
      <button id="expandAll">全部展开</button>
      <button id="collapseAll">全部折叠</button>
    </div>
    <div id="cards"></div>
    <div id="empty">没有匹配的条目，换个说法试试～</div>
  </main>
</div>
<button id="gotop">↑ 顶部</button>

<script>

const cats = DATA.categories, scenarios = DATA.scenarios, commands = DATA.commands;

function levelClass(l){return l==="高频"?"lv-h":l==="偶尔"?"lv-m":"lv-l";}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function slug(s){return "cmd-"+String(s).replace(/[^a-z0-9]+/gi,"-").toLowerCase();}
function searchText(parts){return parts.join(" ").toLowerCase();}
function cmdSearch(c){
  var p=[c.name,c.full,c.use,c.syntax,c.level,(c.tags||[]).join(" ")];
  (c.opts||[]).forEach(function(o){p.push(o[0]+" "+o[1]);});
  (c.examples||[]).forEach(function(e){p.push(e.c+" "+e.d);});
  (c.tips||[]).forEach(function(t){p.push(t);});
  (c.tables||[]).forEach(function(tb){p.push(tb.title);(tb.rows||[]).forEach(function(r){p.push(r.join(" "));});});
  return searchText(p);
}

/* side nav */
var side=document.getElementById("side");
side.innerHTML='<div class="sidenav-title">分类导航</div>'+cats.map(function(c){
  return '<a class="side-link" data-cat="'+c.id+'" href="#cat-'+c.id+'">'+esc(c.label)+'</a>';
}).join("");

/* scenario table */
var stb=document.querySelector("#scenario tbody");
stb.innerHTML=scenarios.map(function(s){
  var hay=searchText([s.intent,s.cmd,s.note]);
  var link=s.ref?('<a href="#'+slug(s.ref)+'"><code>'+esc(s.cmd)+'</code></a>'):('<code>'+esc(s.cmd)+'</code>');
  return '<tr data-search="'+esc(hay)+'"><td class="sc-intent">'+esc(s.intent)+'</td>'
       + '<td class="sc-cmd">'+link+'<button class="copy" data-copy="'+esc(s.cmd)+'">复制</button></td>'
       + '<td class="sc-note">'+esc(s.note||"")+'</td></tr>';
}).join("");

/* command cards, grouped by category */
function optsTable(o){
  if(!o||!o.length) return "";
  return '<table class="sub"><thead><tr><th>选项/用法</th><th>说明</th></tr></thead><tbody>'
    + o.map(function(r){return '<tr><td class="mono">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join("")
    + '</tbody></table>';
}
function genTable(tb){
  return '<div class="tsub">'+esc(tb.title)+'</div><table class="sub"><thead><tr>'
    + tb.headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join("")
    + '</tr></thead><tbody>'
    + tb.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("")+'</tr>';}).join("")
    + '</tbody></table>';
}
function examples(el){
  if(!el||!el.length) return "";
  return '<div class="tsub">示例</div><ol class="ex-list">'
    + el.map(function(e){return '<li><code class="ex">'+esc(e.c)+'</code>'
        + '<button class="copy" data-copy="'+esc(e.c)+'">复制</button>'
        + (e.d?'<span class="d">'+esc(e.d)+'</span>':"")+'</li>';}).join("")
    + '</ol>';
}
function tipList(t){
  if(!t||!t.length) return "";
  return '<div class="tsub">易错点 / 提示</div><ul class="tips">'+t.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';
}
function cardHtml(c){
  var h='<div class="card" id="'+slug(c.id)+'" data-search="'+esc(cmdSearch(c))+'">';
  h+='<div class="card-head"><span class="cname mono">'+esc(c.name)+'</span>'
   + (c.full?'<span class="cfull">'+esc(c.full)+'</span>':'')
   + '<span class="cuse">'+esc(c.use)+'</span>'
   + '<span class="lvl '+levelClass(c.level)+'">'+esc(c.level)+'</span>'
   + '<span class="chev">▶</span></div>';
  h+='<div class="card-body">';
  if(c.syntax){h+='<div class="row"><span class="k">语法</span><code class="syntax">'+esc(c.syntax)+'</code></div>';}
  h+=optsTable(c.opts);
  (c.tables||[]).forEach(function(tb){h+=genTable(tb);});
  h+=examples(c.examples);
  h+=tipList(c.tips);
  h+='<div class="src">来源：'+esc(c.src)+'　·　常用度：'+esc(c.level)+'</div>';
  h+='</div></div>';
  return h;
}
var wrap=document.getElementById("cards"), html="";
cats.forEach(function(c){
  var list=commands.filter(function(x){return x.cat===c.id;});
  if(!list.length) return;
  html+='<section class="cat" id="cat-'+c.id+'"><h2 class="cat-h">'+esc(c.label)+'<span class="cat-desc">'+esc(c.desc)+'</span></h2>';
  list.forEach(function(cmd){html+=cardHtml(cmd);});
  html+='</section>';
});
wrap.innerHTML=html;

/* toggle */
document.addEventListener("click",function(e){
  var head=e.target.closest(".card-head");
  if(head){head.parentElement.classList.toggle("open");return;}
  var cp=e.target.closest(".copy");
  if(cp){
    var txt=cp.getAttribute("data-copy");
    navigator.clipboard&&navigator.clipboard.writeText(txt).then(function(){
      cp.classList.add("done");var old=cp.textContent;cp.textContent="已复制";
      setTimeout(function(){cp.classList.remove("done");cp.textContent=old;},1100);
    }).catch(function(){});
    return;
  }
});

/* toolbar */
document.getElementById("expandAll").onclick=function(){document.querySelectorAll(".card").forEach(function(c){c.classList.add("open");});};
document.getElementById("collapseAll").onclick=function(){document.querySelectorAll(".card").forEach(function(c){c.classList.remove("open");});};

/* search */
var q=document.getElementById("q"), meta=document.getElementById("meta"), empty=document.getElementById("empty");
function runSearch(){
  var toks=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var searching=toks.length>0;
  var shown=0;
  document.querySelectorAll(".card").forEach(function(el){
    var ok=!searching||toks.every(function(t){return el.getAttribute("data-search").indexOf(t)>=0;});
    el.style.display=ok?"":"none";
    if(searching){el.classList.toggle("open",ok);}
    if(ok)shown++;
  });
  document.querySelectorAll("#scenario tbody tr").forEach(function(tr){
    var ok=!searching||toks.every(function(t){return tr.getAttribute("data-search").indexOf(t)>=0;});
    tr.style.display=ok?"":"none";
  });
  document.querySelectorAll(".cat").forEach(function(sec){
    var any=Array.prototype.some.call(sec.querySelectorAll(".card"),function(c){return c.style.display!=="none";});
    sec.style.display=any?"":"none";
  });
  var scsec=document.getElementById("scenario-sec");
  var scAny=Array.prototype.some.call(document.querySelectorAll("#scenario tbody tr"),function(t){return t.style.display!=="none";});
  scsec.style.display=scAny?"":"none";
  if(searching){
    meta.innerHTML="匹配 <b>"+shown+"</b> 条命令";
    if(!shown&&!scAny)empty.style.display="block";else empty.style.display="none";
  }else{
    meta.innerHTML="共 <b>"+commands.length+"</b> 条命令 · "+scenarios.length+" 条场景";
    empty.style.display="none";
  }
}
q.addEventListener("input",runSearch);
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(e.key==="Escape"&&document.activeElement===q){q.value="";runSearch();q.blur();}
});

/* active nav highlight + gotop */
var links=document.querySelectorAll(".side-link");
window.addEventListener("scroll",function(){
  document.getElementById("gotop").style.display=window.scrollY>400?"block":"none";
  var y=window.scrollY+90,cur="";
  document.querySelectorAll(".cat").forEach(function(sec){if(sec.style.display!=="none"&&sec.offsetTop<=y)cur=sec.id.replace("cat-","");});
  links.forEach(function(l){l.classList.toggle("active",l.getAttribute("data-cat")===cur);});
},{passive:true});
document.getElementById("gotop").onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};

/* 主题切换 */
var tt=document.getElementById("themeToggle");
function syncThemeBtn(){tt.textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";}
syncThemeBtn();
tt.onclick=function(){
  var d=document.documentElement.getAttribute("data-theme")==="dark";
  var n=d?"light":"dark";
  document.documentElement.setAttribute("data-theme",n);
  try{localStorage.setItem("theme",n);}catch(e){}
  syncThemeBtn();
};
</script>
